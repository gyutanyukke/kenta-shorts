name: ショート一覧を更新

on:
  schedule:
    - cron: '0 4 * * *'   # 毎日 13:00 JST（GitHubの混雑で数分〜数十分遅れることがあります）
  workflow_dispatch:       # 手動実行（Actions タブの「Run workflow」）
    inputs:
      full:
        description: '全件取り直す'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: YouTube から取得
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FULL: ${{ inputs.full && '1' || '0' }}
        run: node scripts/fetch-videos.mjs

      - name: データをコミット
        id: commit
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "変更なし"
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/videos.json
            git commit -m "データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Vercel に反映
        if: steps.commit.outputs.changed == '1'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK が未設定のためスキップ"
          else
            curl -fsS -X POST "$HOOK" > /dev/null && echo "Vercel に再公開を依頼しました"
          fi
