<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ショート検索">
<title>けんた食堂 ショート検索</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #faf7f2;
    --surface: #ffffff;
    --text: #1f1b16;
    --muted: #6b6258;
    --line: #e7dfd4;
    --accent: #c2410c;
    --accent-weak: #fdebe1;
    --overlay: rgba(20, 14, 8, .45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f;
      --surface: #221e18;
      --text: #f2ece4;
      --muted: #a89d90;
      --line: #3a332a;
      --accent: #fb923c;
      --accent-weak: #3a2414;
      --overlay: rgba(0, 0, 0, .6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    font-size: 16px; line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  body.locked { overflow: hidden; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  .updated { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .search {
    position: relative; margin-top: 10px;
  }
  .search input {
    width: 100%; height: 46px;
    padding: 0 44px 0 40px;
    font-size: 16px; /* 16px以上でiOSの自動ズームを防ぐ */
    color: var(--text);
    background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 12px;
    outline: none; -webkit-appearance: none; appearance: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .search svg.lens {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; stroke: var(--muted);
  }
  .clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border: 0; background: none;
    color: var(--muted); font-size: 20px; display: none; cursor: pointer;
  }
  .clear.show { display: block; }
  .count { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .count b { color: var(--text); }

  main { padding: 4px 0 calc(env(safe-area-inset-bottom) + 24px); }
  ul { list-style: none; margin: 0; padding: 0; }
  li button {
    display: flex; gap: 12px; align-items: center;
    width: 100%; min-height: 72px;
    padding: 10px 16px; border: 0; border-bottom: 1px solid var(--line);
    background: none; color: inherit; text-align: left; font: inherit; cursor: pointer;
  }
  li button:active { background: var(--accent-weak); }
  .thumb {
    flex: none; width: 54px; height: 72px; border-radius: 8px;
    object-fit: cover; background: var(--line);
  }
  .meta { min-width: 0; }
  .t {
    font-size: 15px; font-weight: 600; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: break-all;
  }
  .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  mark { background: var(--accent-weak); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); }

  /* ボトムシート */
  .overlay {
    position: fixed; inset: 0; z-index: 20; background: var(--overlay);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    max-height: 88vh; max-height: 88dvh;
    display: flex; flex-direction: column;
    background: var(--surface); border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,.18);
    transform: translateY(105%); transition: transform .25s ease;
    max-width: 640px; margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }
  .grab { padding: 8px 0 2px; display: flex; justify-content: center; touch-action: none; }
  .grab span { width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
  .sheet-head {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 12px 10px 20px; border-bottom: 1px solid var(--line); touch-action: none;
  }
  .sheet-head h2 { flex: 1; margin: 6px 0 0; font-size: 17px; line-height: 1.45; word-break: break-all; }
  .close {
    flex: none; width: 40px; height: 40px; border: 0; border-radius: 20px;
    background: var(--bg); color: var(--text); font-size: 20px; cursor: pointer;
  }
  .sheet-body { overflow-y: auto; padding: 14px 20px; -webkit-overflow-scrolling: touch; }
  .label { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 4px; }
  .field { margin-bottom: 16px; }
  .desc { white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.7; }
  .desc a, .url a { color: var(--accent); }
  .url { display: flex; gap: 8px; align-items: center; }
  .url a { flex: 1; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
  .copy {
    flex: none; height: 34px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 13px; cursor: pointer;
  }
  .sheet-foot { padding: 10px 20px calc(env(safe-area-inset-bottom) + 14px); border-top: 1px solid var(--line); }
  .open-yt {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 52px; border-radius: 12px; background: var(--accent); color: #fff;
    font-size: 16px; font-weight: 700; text-decoration: none;
  }
  .toast {
    position: fixed; left: 50%; bottom: 120px; z-index: 30; transform: translateX(-50%);
    background: var(--text); color: var(--bg); font-size: 13px; padding: 8px 14px; border-radius: 20px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1>けんた食堂 ショート検索</h1>
    <span class="updated" id="updated"></span>
  </div>
  <div class="search">
    <svg class="lens" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
           placeholder="タイトルで検索（例：アジ）" aria-label="タイトルで検索">
    <button class="clear" id="clear" aria-label="入力を消す">×</button>
  </div>
  <div class="count" id="count">読み込み中…</div>
</header>

<main>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>該当する動画がありません</div>
</main>

<div class="overlay" id="overlay"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title" aria-hidden="true">
  <div class="grab" id="grab"><span></span></div>
  <div class="sheet-head" id="sheet-head">
    <h2 id="s-title"></h2>
    <button class="close" id="close" aria-label="閉じる">×</button>
  </div>
  <div class="sheet-body" id="sheet-body">
    <div class="field"><p class="label">公開日</p><div id="s-date"></div></div>
    <div class="field"><p class="label">URL</p>
      <div class="url"><a id="s-url" target="_blank" rel="noopener"></a><button class="copy" id="copy">コピー</button></div>
    </div>
    <div class="field"><p class="label">概要</p><div class="desc" id="s-desc"></div></div>
  </div>
  <div class="sheet-foot">
    <a class="open-yt" id="s-open" target="_blank" rel="noopener">▶ YouTubeで開く</a>
  </div>
</section>
<div class="toast" id="toast">コピーしました</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let videos = [];
  let synonyms = {};
  let current = null;

  // ---------- 検索用の正規化 ----------
  // 全角/半角・大文字/小文字・カタカナ/ひらがなを同一視する
  const normalize = s => (s || '')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/\s+/g, ' ')
    .trim();

  // 入力1語 → 検索語の候補（同義語辞書で漢字表記を追加）
  const expand = term => {
    const alts = new Set([term]);
    const hit = synonyms[term];
    if (hit) hit.forEach(w => alts.add(normalize(w)));
    return [...alts];
  };

  const filter = query => {
    const terms = normalize(query).split(' ').filter(Boolean);
    if (!terms.length) return { list: videos, words: [] };
    const groups = terms.map(expand);
    const list = videos.filter(v => groups.every(alts => alts.some(a => v._n.includes(a))));
    return { list, words: groups.flat() };
  };

  // ---------- 表示 ----------
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = iso => {
    const d = new Date(iso);
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())}`;
  };

  // 正規化後の一致位置を元の文字列に戻してハイライトする（NFKCで長さが変わる文字は1文字ずつ対応づけ）
  const highlight = (title, words) => {
    if (!words.length) return esc(title);
    const chars = [...title];
    const map = []; let norm = '';
    for (let i = 0; i < chars.length; i++) {
      // 半角の濁点・半濁点（ｼﾞ など）は前の文字とまとめて正規化する
      const pair = /[ﾞﾟ]/.test(chars[i + 1] || '');
      const n = normalize(pair ? chars[i] + chars[i + 1] : chars[i]) || ' ';
      for (const _ of n) map.push(i);
      norm += n;
      if (pair) i++;
    }
    const on = new Array(chars.length).fill(false);
    words.forEach(w => {
      if (!w) return;
      let from = 0, at;
      while ((at = norm.indexOf(w, from)) !== -1) {
        for (let k = at; k < at + w.length; k++) {
          const i = map[k];
          on[i] = true;
          if (/[ﾞﾟ]/.test(chars[i + 1] || '')) on[i + 1] = true;
        }
        from = at + 1;
      }
    });
    let out = '', inMark = false;
    chars.forEach((ch, i) => {
      if (on[i] && !inMark) { out += '<mark>'; inMark = true; }
      if (!on[i] && inMark) { out += '</mark>'; inMark = false; }
      out += esc(ch);
    });
    return out + (inMark ? '</mark>' : '');
  };

  const render = () => {
    const q = $('q').value;
    const { list, words } = filter(q);
    $('clear').classList.toggle('show', q.length > 0);
    $('count').innerHTML = q.trim()
      ? `「${esc(q.trim())}」<b>${list.length}</b>件 / 全${videos.length}件`
      : `全<b>${videos.length}</b>件（新しい順）`;
    $('empty').hidden = list.length > 0;
    $('list').innerHTML = list.map(v => `
      <li><button data-id="${esc(v.id)}">
        <img class="thumb" src="${esc(v.thumbnail)}" alt="" loading="lazy" decoding="async" onerror="this.style.visibility='hidden'">
        <div class="meta"><div class="t">${highlight(v.title, words)}</div><div class="d">${fmtDate(v.publishedAt)}</div></div>
      </button></li>`).join('');
  };

  // ---------- 詳細シート ----------
  const linkify = text => esc(text).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);

  const openSheet = (v, push = true) => {
    current = v;
    $('s-title').textContent = v.title;
    $('s-date').textContent = fmtDate(v.publishedAt);
    $('s-url').textContent = v.url;
    $('s-url').href = v.url;
    $('s-open').href = v.url;
    $('s-desc').innerHTML = v.description ? linkify(v.description) : '<span style="color:var(--muted)">（概要なし）</span>';
    $('sheet-body').scrollTop = 0;
    $('sheet').style.transform = '';
    $('sheet').classList.add('open');
    $('sheet').setAttribute('aria-hidden', 'false');
    $('overlay').classList.add('open');
    document.body.classList.add('locked');
    if (push) history.pushState({ sheet: v.id }, '');
  };

  const closeSheet = (fromHistory = false) => {
    if (!current) return;
    current = null;
    $('sheet').style.transform = '';
    $('sheet').classList.remove('open');
    $('sheet').setAttribute('aria-hidden', 'true');
    $('overlay').classList.remove('open');
    document.body.classList.remove('locked');
    if (!fromHistory && history.state && history.state.sheet) history.back();
  };

  // ---------- イベント ----------
  let timer;
  $('q').addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      render();
      const url = new URL(location.href);
      const q = $('q').value.trim();
      q ? url.searchParams.set('q', q) : url.searchParams.delete('q');
      history.replaceState(history.state, '', url);
      window.scrollTo(0, 0);
    }, 200);
  });
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  $('clear').addEventListener('click', () => { $('q').value = ''; $('q').dispatchEvent(new Event('input')); $('q').focus(); });

  $('list').addEventListener('click', e => {
    const b = e.target.closest('button[data-id]');
    if (!b) return;
    const v = videos.find(x => x.id === b.dataset.id);
    if (v) openSheet(v);
  });
  $('close').addEventListener('click', () => closeSheet());
  $('overlay').addEventListener('click', () => closeSheet());
  window.addEventListener('popstate', () => closeSheet(true));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  $('copy').addEventListener('click', async () => {
    if (!current) return;
    try { await navigator.clipboard.writeText(current.url); }
    catch {
      const ta = document.createElement('textarea'); ta.value = current.url; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
    }
    $('toast').classList.add('show');
    setTimeout(() => $('toast').classList.remove('show'), 1400);
  });

  // 下スワイプで閉じる（つまみとタイトル部分）
  let startY = null, dy = 0;
  const onStart = e => { startY = e.touches[0].clientY; dy = 0; $('sheet').style.transition = 'none'; };
  const onMove = e => {
    if (startY === null) return;
    dy = Math.max(0, e.touches[0].clientY - startY);
    $('sheet').style.transform = `translateY(${dy}px)`;
  };
  const onEnd = () => {
    if (startY === null) return;
    $('sheet').style.transition = '';
    startY = null;
    if (dy > 90) closeSheet(); else $('sheet').style.transform = '';
  };
  ['grab', 'sheet-head'].forEach(id => {
    $(id).addEventListener('touchstart', onStart, { passive: true });
    $(id).addEventListener('touchmove', onMove, { passive: true });
    $(id).addEventListener('touchend', onEnd);
  });

  // ---------- 読み込み ----------
  const load = async () => {
    try {
      const [vRes, sRes] = await Promise.all([
        fetch('data/videos.json', { cache: 'no-cache' }),
        fetch('data/synonyms.json', { cache: 'no-cache' }).catch(() => null),
      ]);
      const data = await vRes.json();
      if (sRes && sRes.ok) {
        const raw = await sRes.json();
        for (const [k, list] of Object.entries(raw)) {
          if (k.startsWith('_')) continue;
          synonyms[normalize(k)] = list;
        }
      }
      videos = (data.videos || []).map(v => ({ ...v, _n: normalize(v.title) }));
      if (data.fetchedAt) {
        const d = new Date(data.fetchedAt);
        $('updated').textContent = `更新 ${fmtDate(data.fetchedAt)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      } else {
        $('updated').textContent = '未取得';
      }
      const q = new URL(location.href).searchParams.get('q');
      if (q) $('q').value = q;
      render();
    } catch (err) {
      $('count').textContent = 'データを読み込めませんでした。通信状況を確認してください。';
      console.error(err);
    }
  };
  load();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
